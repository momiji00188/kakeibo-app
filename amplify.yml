version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@11.0.0
        - pnpm install --ignore-scripts
        - pnpm rebuild esbuild
    build:
      commands:
        - pnpm build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
